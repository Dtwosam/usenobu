openapi: 3.1.0
info:
  title: Nobu A2MCP API
  version: 1.1.0
  description: >-
    Nobu is an AI agent that monitors supported purchases after checkout.
    Free A2MCP endpoints: structured Target price check and bounded agent actions.
    Target verifies prices and makes the final decision. Currently supports
    eligible Target.com purchases only.
servers:
  - url: https://usenobu.vercel.app
    description: Public HTTPS free A2MCP (UseNobu production)
  - url: http://127.0.0.1:3000
    description: Local Next.js dev only — not external proof
paths:
  /v1/agent:
    post:
      operationId: nobuAgent
      summary: Bounded Nobu agent actions (understand, check confirmed, status)
      description: >-
        Fixed actions only. UNDERSTAND_PURCHASE extracts fields and always requires
        user confirmation. CHECK_CONFIRMED_PURCHASE runs the existing deterministic
        Target check. CHECK_MONITORING_STATUS returns stored monitor state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRequest'
      responses:
        '200':
          description: Agent action result
        '400':
          description: Invalid input
        '404':
          description: Purchase not found
        '429':
          description: Rate limited
        '503':
          description: AI provider unavailable
  /v1/target-price-check:
    post:
      operationId: checkTargetPriceProtection
      summary: Check a recent Target.com purchase for a possible price drop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetPriceCheckRequest'
      responses:
        '200':
          description: Structured check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetPriceCheckResponse'
        '400':
          description: Invalid input
        '429':
          description: Rate limited
        '503':
          description: Provider unavailable
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service health
components:
  schemas:
    TargetPriceCheckRequest:
      type: object
      required:
        - target_product_url
        - purchase_price
        - currency
        - purchase_date
        - country
        - purchase_channel
      properties:
        target_product_url:
          type: string
          format: uri
        purchase_price:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          const: USD
        purchase_date:
          type: string
          format: date
        country:
          type: string
          const: US
        region:
          type: string
          description: U.S. state or territory code
        purchase_channel:
          type: string
          const: target_online
        model_number:
          type: string
        upc_or_gtin:
          type: string
        target_item_id:
          type: string
        user_confirmed_match_id:
          type: string
          description: Optional locked fingerprint from prior candidate confirmation
    TargetPriceCheckResponse:
      type: object
      required:
        - status
        - policy_id
        - price_source_type
        - final_decision_by
        - checked_at
      properties:
        status:
          type: string
          enum:
            - PRICE_DROP_DETECTED
            - POTENTIALLY_ELIGIBLE
            - NO_PRICE_DROP
            - WINDOW_EXPIRED
            - MATCH_REVIEW_REQUIRED
            - NO_RELIABLE_PRICE
            - POLICY_EXCLUSION
            - UNSUPPORTED_PURCHASE
            - POLICY_STALE
            - DATA_SOURCE_UNAVAILABLE
        purchase_price:
          type: number
        observed_target_price:
          type: number
        potential_recovery:
          type: number
        currency:
          type: string
        days_remaining:
          type: integer
        matched_product:
          type: object
          additionalProperties: true
        price_source_type:
          type: string
          const: THIRD_PARTY_SEARCH_OBSERVATION
        provider:
          type: string
          const: SerpApi
        policy_id:
          type: string
          const: target-us-online-price-match-v1
        checked_at:
          type: string
          format: date-time
        official_next_action:
          type: object
          properties:
            online_chat:
              type: boolean
            guest_services_phone:
              type: string
        final_decision_by:
          type: string
          const: Target
        disclaimer:
          type: string
        policy_version:
          type: string
          description: Approved policy version (backward-compatible extension)
        policy_verified_at:
          type: string
          format: date-time
          description: Last approved source-check timestamp (backward-compatible extension)
        policy_review_state:
          type: string
          description: Operational review state CURRENT|CHECK_DUE|SOURCE_UNAVAILABLE|CHANGE_DETECTED|REVIEW_REQUIRED|RETIRED
        policy_warning:
          type: string
          nullable: true
          description: Visible policy-review warning when review is due or blocked
        eligibility_suppressed:
          type: boolean
          description: True when positive eligibility was suppressed pending policy owner review
    AgentRequest:
      oneOf:
        - type: object
          required: [action, purchase_text]
          additionalProperties: false
          properties:
            action:
              type: string
              const: UNDERSTAND_PURCHASE
            purchase_text:
              type: string
              maxLength: 2000
        - type: object
          required:
            - action
            - target_product_url
            - purchase_price
            - currency
            - purchase_date
            - country
            - purchase_channel
          additionalProperties: false
          properties:
            action:
              type: string
              const: CHECK_CONFIRMED_PURCHASE
            target_product_url:
              type: string
              format: uri
            purchase_price:
              type: number
            currency:
              type: string
              const: USD
            purchase_date:
              type: string
              format: date
            country:
              type: string
              const: US
            region:
              type: string
            purchase_channel:
              type: string
              const: target_online
            model_number:
              type: string
            upc_or_gtin:
              type: string
            target_item_id:
              type: string
            user_confirmed_match_id:
              type: string
        - type: object
          required: [action, purchase_id]
          additionalProperties: false
          properties:
            action:
              type: string
              const: CHECK_MONITORING_STATUS
            purchase_id:
              type: string


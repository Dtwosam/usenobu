openapi: 3.1.0
info:
  title: Nobu A2MCP API
  version: 1.2.0
  description: >-
    Nobu is an AI post-purchase monitoring agent. Free A2MCP endpoints:
    structured Target price check and bounded free agent actions on POST /v1/agent.
    Paid Monitoring Pass purchase is a separate route (POST /v1/agent/monitoring-pass);
    see openapi/nobu-agent-native-paid-monitoring-proposed.openapi.yaml.
    Target is the only retailer currently supported. Target verifies prices and
    makes the final decision. Observed prices are third-party SerpApi observations.
servers:
  - url: https://usenobu.vercel.app
    description: Public HTTPS free A2MCP (UseNobu production)
  - url: http://127.0.0.1:3000
    description: Local Next.js dev only — not external proof
paths:
  /v1/agent:
    get:
      operationId: nobuAgentInputRequirements
      summary: Service input requirements for an empty validation probe
      description: >-
        Returns HTTP 400 with `status: input_required`, `fields: [action]`,
        `requiredArgs: [action]`, supported actions with their action-specific
        required fields, and one working example. Official Onchain OS 4.4.0
        recognizes this as inputRequired and can continue its service-input
        flow. This free endpoint never returns a payment requirement.
      responses:
        '400':
          description: Input required before a Nobu action can run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInputRequired'
    post:
      operationId: nobuAgent
      summary: Bounded free Nobu agent actions
      description: >-
        Free actions only (never HTTP 402). Actions include purchase understanding,
        product discovery and exact confirmation, email verification, preflight
        (consent + eligibility + quote preparation), Monitoring Pass redemption,
        monitor list/status, email-alert preference, stop monitoring, and connection
        revocation. Backward-compatible with the original UNDERSTAND_PURCHASE,
        CHECK_CONFIRMED_PURCHASE, and CHECK_MONITORING_STATUS actions. Does not
        expose secrets or internal-only fields.


        An empty/bodyless POST, `{}`, or an envelope with no recognised `action`
        returns HTTP 400 with `status: input_required` and truthful action-input
        metadata. A recognised `action` keeps its existing behavior. This free
        service never returns HTTP 402.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AgentRequest'
                - type: object
                  description: Empty/unshaped validation body; answered with input requirements.
      responses:
        '200':
          description: >-
            Successful action result. Every journey step also returns
            completed_step, monitoring_active, journey_complete, next_action,
            required_user_input, and user-facing guidance. Only successful
            REDEEM_MONITORING_PASS returns status MONITORING_ACTIVE.
        '400':
          description: Input required, invalid JSON, or a recognised action with invalid fields
        '401':
          description: Missing or invalid connection credentials for a protected action
        '404':
          description: Purchase, session, or resource not found
        '429':
          description: Rate limited
        '503':
          description: AI provider or dependency unavailable
  /v1/target-price-check:
    post:
      operationId: checkTargetPriceProtection
      summary: Check a recent Target.com purchase for a possible price drop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetPriceCheckRequest'
      responses:
        '200':
          description: Structured check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetPriceCheckResponse'
        '400':
          description: Invalid input
        '429':
          description: Rate limited
        '503':
          description: Provider unavailable
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service health
components:
  schemas:
    ServiceInputRequired:
      type: object
      description: >-
        Empty validation response for the free Nobu service. `action` is the
        only field common to every valid request; each supported action declares
        its remaining required fields below.
      required: [agent_state, status, introduction, fields, requiredArgs, supported_actions, example_request, completed_step, monitoring_active, journey_complete, next_action, required_user_input, guidance]
      properties:
        agent_state:
          type: string
          const: SERVICE_INPUT
        status:
          type: string
          const: input_required
        introduction:
          type: string
          description: Nobu is introduced before service details are shown.
        fields:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            const: action
        requiredArgs:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            const: action
        service:
          type: string
        protocol:
          type: string
          const: A2MCP
        request:
          type: object
          properties:
            method:
              type: string
            content_type:
              type: string
            envelope:
              type: string
        supported_actions:
          type: array
          items:
            type: object
            required: [action, summary, required_fields]
            properties:
              action:
                type: string
              summary:
                type: string
              required_fields:
                type: array
                items:
                  type: string
              optional_fields:
                type: array
                items:
                  type: string
        recommended_first_action:
          type: string
        example_request:
          type: object
          additionalProperties: true
        paid_service:
          type: object
          description: Where to buy the Monitoring Pass that REDEEM_MONITORING_PASS consumes.
          properties:
            name:
              type: string
            endpoint:
              type: string
            price:
              type: string
            description:
              type: string
        retailer_support:
          type: string
        documentation:
          type: string
        next_action:
          type: string
        completed_step:
          type: string
          const: NOBU_INTRODUCED
        monitoring_active:
          type: boolean
          const: false
        journey_complete:
          type: boolean
          const: false
        required_user_input:
          type: object
          additionalProperties: true
        guidance:
          type: string
    TargetPriceCheckRequest:
      type: object
      required:
        - target_product_url
        - purchase_price
        - currency
        - purchase_date
        - country
        - purchase_channel
      properties:
        target_product_url:
          type: string
          format: uri
        purchase_price:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          const: USD
        purchase_date:
          type: string
          format: date
        country:
          type: string
          const: US
        region:
          type: string
          description: U.S. state or territory code
        purchase_channel:
          type: string
          const: target_online
        model_number:
          type: string
        upc_or_gtin:
          type: string
        target_item_id:
          type: string
        user_confirmed_match_id:
          type: string
          description: Optional locked fingerprint from prior candidate confirmation
    TargetPriceCheckResponse:
      type: object
      required:
        - status
        - policy_id
        - price_source_type
        - final_decision_by
        - checked_at
      properties:
        status:
          type: string
          enum:
            - PRICE_DROP_DETECTED
            - POTENTIALLY_ELIGIBLE
            - NO_PRICE_DROP
            - WINDOW_EXPIRED
            - MATCH_REVIEW_REQUIRED
            - NO_RELIABLE_PRICE
            - POLICY_EXCLUSION
            - UNSUPPORTED_PURCHASE
            - POLICY_STALE
            - DATA_SOURCE_UNAVAILABLE
        purchase_price:
          type: number
        observed_target_price:
          type: number
        potential_recovery:
          type: number
        currency:
          type: string
        days_remaining:
          type: integer
        matched_product:
          type: object
          additionalProperties: true
        price_source_type:
          type: string
          const: THIRD_PARTY_SEARCH_OBSERVATION
        provider:
          type: string
          const: SerpApi
        policy_id:
          type: string
          const: target-us-online-price-match-v1
        checked_at:
          type: string
          format: date-time
        official_next_action:
          type: object
          properties:
            online_chat:
              type: boolean
            guest_services_phone:
              type: string
        final_decision_by:
          type: string
          const: Target
        disclaimer:
          type: string
        policy_version:
          type: string
          description: Approved policy version (backward-compatible extension)
        policy_verified_at:
          type: string
          format: date-time
          description: Last approved source-check timestamp (backward-compatible extension)
        policy_review_state:
          type: string
          description: Operational review state CURRENT|CHECK_DUE|SOURCE_UNAVAILABLE|CHANGE_DETECTED|REVIEW_REQUIRED|RETIRED
        policy_warning:
          type: string
          nullable: true
          description: Visible policy-review warning when review is due or blocked
        eligibility_suppressed:
          type: boolean
          description: True when positive eligibility was suppressed pending policy owner review
    DiscoveryPurchaseFields:
      type: object
      additionalProperties: false
      required: [purchase_price, purchase_date]
      properties:
        purchase_price:
          type: number
          exclusiveMinimum: 0
        purchase_date:
          type: string
        purchase_channel:
          type: string
          const: target_online
        country:
          type: string
          const: US
        region:
          type: string
        product_title:
          type: string
          maxLength: 200
        product_description:
          type: string
          maxLength: 2000
        target_product_url:
          type: string
        target_item_id:
          type: string
        model_number:
          type: string
        upc_or_gtin:
          type: string
        brand:
          type: string
        size:
          type: string
        color:
          type: string
        quantity:
          type: string
    AgentRequest:
      oneOf:
        - type: object
          required: [action, purchase_text]
          additionalProperties: false
          properties:
            action:
              type: string
              const: UNDERSTAND_PURCHASE
            purchase_text:
              type: string
              maxLength: 2000
        - type: object
          required:
            - action
            - target_product_url
            - purchase_price
            - currency
            - purchase_date
            - country
            - purchase_channel
          additionalProperties: false
          properties:
            action:
              type: string
              const: CHECK_CONFIRMED_PURCHASE
            target_product_url:
              type: string
              format: uri
            purchase_price:
              type: number
            currency:
              type: string
              const: USD
            purchase_date:
              type: string
              format: date
            country:
              type: string
              const: US
            region:
              type: string
            purchase_channel:
              type: string
              const: target_online
            model_number:
              type: string
            upc_or_gtin:
              type: string
            target_item_id:
              type: string
            user_confirmed_match_id:
              type: string
        - type: object
          required: [action, purchase_id]
          additionalProperties: false
          properties:
            action:
              type: string
              const: CHECK_MONITORING_STATUS
            purchase_id:
              type: string
            connection_id:
              type: string
              description: Required for account-owned / agent monitors
            connection_token:
              type: string
              description: Secret credential; never log or return after mint
        - type: object
          required: [action, email]
          additionalProperties: false
          properties:
            action:
              type: string
              const: BEGIN_EMAIL_VERIFICATION
            email:
              type: string
              maxLength: 254
        - type: object
          required: [action, connection_id, code]
          additionalProperties: false
          properties:
            action:
              type: string
              const: VERIFY_EMAIL_CODE
            connection_id:
              type: string
            code:
              type: string
              minLength: 6
              maxLength: 32
        - type: object
          required: [action, connection_id, connection_token]
          additionalProperties: false
          properties:
            action:
              type: string
              const: REVOKE_AGENT_CONNECTION
            connection_id:
              type: string
            connection_token:
              type: string
        - type: object
          required: [action, purchase]
          additionalProperties: false
          properties:
            action:
              type: string
              const: DISCOVER_PRODUCT
            purchase:
              $ref: '#/components/schemas/DiscoveryPurchaseFields'
        - type: object
          required: [action, discovery_session_id, candidate_id]
          additionalProperties: false
          properties:
            action:
              type: string
              const: CONFIRM_PRODUCT
            discovery_session_id:
              type: string
            candidate_id:
              type: string
        - type: object
          required:
            - action
            - connection_id
            - connection_token
            - discovery_session_id
            - monitoring_consent
            - email_alert_consent
          additionalProperties: false
          properties:
            action:
              type: string
              const: PREFLIGHT_MONITORING
            connection_id:
              type: string
            connection_token:
              type: string
            discovery_session_id:
              type: string
            monitoring_consent:
              type: boolean
            email_alert_consent:
              type: boolean
        - type: object
          required: [action, connection_id, connection_token]
          additionalProperties: false
          properties:
            action:
              type: string
              const: LIST_ACTIVE_MONITORS
            connection_id:
              type: string
            connection_token:
              type: string
        - type: object
          required: [action, connection_id, connection_token, purchase_id]
          additionalProperties: false
          properties:
            action:
              type: string
              const: ENABLE_EMAIL_ALERTS
            connection_id:
              type: string
            connection_token:
              type: string
            purchase_id:
              type: string
        - type: object
          required: [action, connection_id, connection_token, purchase_id]
          additionalProperties: false
          properties:
            action:
              type: string
              const: DISABLE_EMAIL_ALERTS
            connection_id:
              type: string
            connection_token:
              type: string
            purchase_id:
              type: string
        - type: object
          required: [action, connection_id, connection_token, purchase_id]
          additionalProperties: false
          properties:
            action:
              type: string
              const: STOP_MONITORING
            connection_id:
              type: string
            connection_token:
              type: string
            purchase_id:
              type: string
        - type: object
          description: >-
            Lane 8R.3B — redeems a paid Nobu Monitoring Pass bought at
            POST /v1/agent/monitoring-pass. Every identity, confirmation,
            eligibility and consent gate is enforced here; a failed redemption
            never consumes the pass, and one pass activates exactly one monitor.
          required:
            - action
            - monitoring_pass_id
            - quote_id
            - connection_id
            - connection_token
          additionalProperties: false
          properties:
            action:
              type: string
              const: REDEEM_MONITORING_PASS
            monitoring_pass_id:
              type: string
            quote_id:
              type: string
              description: From a prior PREFLIGHT_MONITORING MONITORING_PAYMENT_READY response.
            connection_id:
              type: string
            connection_token:
              type: string

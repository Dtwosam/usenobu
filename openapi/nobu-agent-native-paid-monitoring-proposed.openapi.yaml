openapi: 3.1.0
info:
  title: Nobu Agent-Native Paid Monitoring API (MOSTLY PROPOSED — PARTIALLY IMPLEMENTED)
  version: 0.3.0-proposed
  description: >-
    MOSTLY PROPOSED, RESEARCH-STAGE CONTRACT — with one implemented slice.
    As of Lane 7.4B, `BEGIN_EMAIL_VERIFICATION`, `VERIFY_EMAIL_CODE`, and
    `REVOKE_AGENT_CONNECTION` are IMPLEMENTED on the live `/v1/agent` route
    (`app/v1/agent/route.ts` -> `runAgentAction`), additive and
    backward-compatible with the three pre-existing live actions. Every other
    action in this document (DISCOVER_PRODUCT, CONFIRM_PRODUCT,
    PREFLIGHT_MONITORING, LIST_ACTIVE_MONITORS, ENABLE_EMAIL_ALERTS,
    DISABLE_EMAIL_ALERTS, STOP_MONITORING, and the entire paid
    `/v1/agent/start-monitoring` path) remains PROPOSED / NOT IMPLEMENTED.
    Each schema below is marked `x-nobu-implementation-status` to disambiguate.
    ASP #5541's registered listing is unchanged by Lane 7.4B (free actions on
    the same already-free endpoint; no marketplace/listing modification).

    This file is an internal design artifact originating from Lane 7.4A / 7.4A.1
    (`docs/nobu-okx-agent-native-paid-monitoring-architecture.md`), now partially
    realized by Lane 7.4B. It shows the *logical* shape of a proposed free
    agent-native discovery/preflight surface and a proposed paid activation
    surface. It intentionally does NOT declare, imply, or assume that both
    paths can be exposed through a single OKX A2MCP listing, or through more
    than one listing — that marketplace topology is UNDECIDED (see
    `x-nobu-topology-status` on the paid path below).

    Source purity: every OKX-specific fact this file assumes (registration is
    one price per call per endpoint; price 0 = free; an endpoint is either
    free-200 or x402-402-then-replay; the seller flow is
    protected-request -> 402 challenge -> signed payment -> replay; the
    official X Layer settlement example) comes from official OKX documentation
    or coordinator-provided official findings recorded in
    `docs/external-source-registry.md`, under the Lane 7.4A / 7.4A.1 entries.
    No non-OKX payment source (x402.org, Cloudflare, packaged environment
    skills, web search synthesis, or generic MCP/x402 precedent) is used as
    authority for any OKX-specific behavior in this file.
  contact:
    name: Nobu internal architecture — not a public support channel
servers:
  - url: https://usenobu.vercel.app
    description: >-
      Placeholder only. Whether the paid path is served from this same host,
      a different host, or a different ASP identity is undecided (see below).
paths:
  /v1/agent:
    post:
      operationId: nobuAgentProposedFree
      summary: >-
        PROPOSED, FREE-ONLY additive actions on top of the live nobuAgent
        operation. Every action below returns HTTP 200 (or a documented 4xx/5xx)
        and never a 402. No payment ever occurs on this path.
      description: >-
        Extends the live AgentRequest oneOf (UNDERSTAND_PURCHASE,
        CHECK_CONFIRMED_PURCHASE, CHECK_MONITORING_STATUS — unchanged, see the
        live contract) with additive, backward-compatible free actions:
        DISCOVER_PRODUCT, CONFIRM_PRODUCT, BEGIN_EMAIL_VERIFICATION,
        VERIFY_EMAIL_CODE, PREFLIGHT_MONITORING, LIST_ACTIVE_MONITORS,
        ENABLE_EMAIL_ALERTS, DISABLE_EMAIL_ALERTS, STOP_MONITORING,
        REVOKE_AGENT_CONNECTION.

        Ordering: DISCOVER_PRODUCT and CONFIRM_PRODUCT operate on an
        unauthenticated, expiring discovery_session_id and require no
        connection — discovery never requires prior email verification, and
        no durable owned purchase or private monitoring state exists yet.
        BEGIN_EMAIL_VERIFICATION / VERIFY_EMAIL_CODE establish a verified
        connection_id + one-time connection_token. Every action after
        VERIFY_EMAIL_CODE requires both connection_id (a non-secret handle)
        and a valid connection_token (the secret credential) — the handle
        alone never authorizes anything. PREFLIGHT_MONITORING is the free/paid
        boundary: on full eligibility + consent pass it materializes the
        purchase, mints an enrollment quote, and returns
        MONITORING_PAYMENT_READY (a Nobu status in a 200 body, not an HTTP 402
        itself); it never takes payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposedFreeAgentRequest'
      responses:
        '200':
          description: Action result (status-bearing body; see ContinuationStatus)
        '400':
          description: Invalid input
        '401':
          description: Missing or invalid connection_token for a protected action (ACTION_NOT_AUTHORIZED)
        '404':
          description: Purchase, discovery session, connection, or quote not found
        '429':
          description: Rate limited
        '503':
          description: Provider unavailable
  /v1/agent/start-monitoring:
    post:
      operationId: nobuAgentProposedPaidActivation
      summary: >-
        PROPOSED, PAID activation only. Marketplace topology undecided — see
        x-nobu-topology-status below and Lane 7.4D in the architecture
        document. Do not treat this path as reachable from the live #5541
        listing.
      description: >-
        Consumes a settled OKX x402 payment against a previously issued,
        unexpired monitoring_enrollment_quotes row (minted by a prior free
        PREFLIGHT_MONITORING call) and performs exactly-once monitor
        activation. Activation identity is derived entirely server-side from
        the quote id, the OKX-verified settlement reference, the confirmed
        purchase, and the locked fingerprint — this endpoint does not accept
        or trust any caller-supplied idempotency key. First valid paid replay
        creates exactly one monitor; a valid replay that resolves to an
        already-consumed quote returns HTTP 200 with status ALREADY_ACTIVE and
        the original monitor_id — never HTTP 409, and never a duplicate
        monitor. Altered or expired quotes fail closed (CONNECTION_EXPIRED)
        and are never re-priced or re-matched on the fly. This action never
        overrides deterministic eligibility, matching, or consent — those were
        already enforced by PREFLIGHT_MONITORING before the quote existed.
      x-nobu-topology-status: >-
        UNDECIDED as of Lane 7.4A.1 (2026-07-20). Three possibilities are
        documented in the architecture document §5 and none is selected: (1)
        one mixed free/paid A2MCP listing; (2) separate free and paid A2MCP
        listings; (3) convert the current free service to paid and relocate
        free preparation elsewhere. Selecting between them requires official
        OKX confirmation, obtained only during Lane 7.4D's "OKX paid-service
        topology capability re-check" — and only after the Lane 8 gate (ASP
        #5541 approved and genuinely live) has passed. If still unresolved at
        that point, Lane 7.4D returns NOBU_LANE_7_4D_BLOCKED rather than
        guessing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartMonitoringRequest'
      responses:
        '200':
          description: MONITORING_STARTED or ALREADY_ACTIVE (both HTTP 200 — a valid replay is never a 409)
        '400':
          description: Invalid input
        '402':
          description: >-
            OKX x402 Payment Required challenge for this protected resource.
            Exact accepts[]/network/asset shape follows the official X Layer
            example recorded in docs/external-source-registry.md
            (OKX-XLAYER-EXAMPLE: eip155:196, USD₮0,
            0x779ded0c9e1022225f8e0630b35a9b54be713736, 6 decimals, 990000
            base units = $0.99) pending Lane 7.4D confirming this is the asset
            Nobu's own listing will actually use.
        '404':
          description: Quote not found
        '409':
          description: >-
            Genuine conflict only — e.g. a request whose purchase_id,
            fingerprint_id, or price do not match the stored quote at all.
            Never used for a valid replay of an already-settled activation
            (that is 200 ALREADY_ACTIVE — see description above).
        '422':
          description: Quote failed re-validation (eligibility no longer holds — fail closed, no silent re-check)
        '423':
          description: CONNECTION_EXPIRED — quote altered or expired; caller must re-run PREFLIGHT_MONITORING for a fresh quote
components:
  schemas:
    ContinuationStatus:
      type: string
      description: >-
        Additive to the live A2mcpStatus/agent-response vocabulary.
        EMAIL_CODE_SENT, EMAIL_VERIFIED, CODE_INVALID, CODE_EXPIRED,
        ACTION_NOT_AUTHORIZED, and CONNECTION_REVOKED are IMPLEMENTED
        (Lane 7.4B). The rest remain PROPOSED / NOT IMPLEMENTED.
      enum:
        - MORE_INFORMATION_REQUIRED
        - PRODUCT_CONFIRMATION_REQUIRED
        - EMAIL_VERIFICATION_REQUIRED
        - EMAIL_CODE_SENT
        - EMAIL_VERIFIED
        - CODE_INVALID
        - CODE_EXPIRED
        - CONNECTION_REVOKED
        - CONSENT_REQUIRED
        - MONITORING_PAYMENT_READY
        - PAYMENT_PENDING
        - MONITORING_STARTED
        - MONITORING_ACTIVE
        - PRICE_DROP_DETECTED
        - ALREADY_ACTIVE
        - ACTION_NOT_AUTHORIZED
        - CONNECTION_EXPIRED
        - UNSUPPORTED_PURCHASE
    ProposedFreeAgentRequest:
      oneOf:
        - $ref: '#/components/schemas/DiscoverProductRequest'
        - $ref: '#/components/schemas/ConfirmProductRequest'
        - $ref: '#/components/schemas/BeginEmailVerificationRequest'
        - $ref: '#/components/schemas/VerifyEmailCodeRequest'
        - $ref: '#/components/schemas/PreflightMonitoringRequest'
        - $ref: '#/components/schemas/ListActiveMonitorsRequest'
        - $ref: '#/components/schemas/SetEmailAlertsRequest'
        - $ref: '#/components/schemas/StopMonitoringRequest'
        - $ref: '#/components/schemas/RevokeAgentConnectionRequest'
    DiscoverProductRequest:
      type: object
      required: [action, purchase_text]
      additionalProperties: false
      x-nobu-implementation-status: PROPOSED / NOT IMPLEMENTED (Lane 7.4C)
      properties:
        action:
          type: string
          const: DISCOVER_PRODUCT
        purchase_text:
          type: string
          maxLength: 2000
        target_product_url:
          type: string
          format: uri
        target_item_id:
          type: string
      description: >-
        No connection_id/connection_token required — discovery never requires
        prior email verification and creates no durable owned purchase.
    DiscoverProductResponse:
      type: object
      required: [agent_state, discovery_session_id, discovery_session_expires_at]
      properties:
        agent_state:
          type: string
          const: PRODUCT_DISCOVERY
        discovery_session_id:
          type: string
          description: Expiring, server-issued handle for the candidate snapshot. Not a credential; not owned by any account.
        discovery_session_expires_at:
          type: string
          format: date-time
        candidates:
          type: array
          items:
            type: object
            additionalProperties: true
    ConfirmProductRequest:
      type: object
      required: [action, discovery_session_id, candidate_id]
      additionalProperties: false
      x-nobu-implementation-status: PROPOSED / NOT IMPLEMENTED (Lane 7.4C)
      properties:
        action:
          type: string
          const: CONFIRM_PRODUCT
        discovery_session_id:
          type: string
          description: From a prior DISCOVER_PRODUCT response.
        candidate_id:
          type: string
          description: >-
            Server-issued candidate id from that same discovery session.
            Never a client-asserted product payload — reuses the existing
            reload-and-revalidate confirmation pattern from
            src/matching/confirm.ts, scoped to the discovery session rather
            than an account.
      description: >-
        No connection_id/connection_token required. Locks a fingerprint
        against the discovery session only; still no durable owned purchase.
    BeginEmailVerificationRequest:
      type: object
      required: [action, email]
      additionalProperties: false
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4B)
      properties:
        action:
          type: string
          const: BEGIN_EMAIL_VERIFICATION
        email:
          type: string
          format: email
      description: >-
        No connection_id/connection_token required. Creates a pending
        connection scoped to this email and sends a six-digit code through
        the existing Resend-backed email provider. Never reveals whether the
        email already has an account — no account row is touched until
        VERIFY_EMAIL_CODE succeeds. Rate-limited per-email and per-request-source.
    BeginEmailVerificationResponse:
      type: object
      required: [agent_state, status, connection_id, expires_at, resend_after_seconds]
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4B)
      properties:
        agent_state:
          type: string
          const: EMAIL_VERIFICATION
        status:
          $ref: '#/components/schemas/ContinuationStatus'
        connection_id:
          type: string
          description: >-
            Non-secret handle for the pending connection. Never sufficient
            alone to authorize a protected action.
        expires_at:
          type: string
          format: date-time
          description: Code expiry — 10 minutes from issuance.
        resend_after_seconds:
          type: integer
    VerifyEmailCodeRequest:
      type: object
      required: [action, connection_id, code]
      additionalProperties: false
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4B)
      properties:
        action:
          type: string
          const: VERIFY_EMAIL_CODE
        connection_id:
          type: string
          description: From a prior BEGIN_EMAIL_VERIFICATION response.
        code:
          type: string
          minLength: 6
          description: Exactly six numeric digits. Short-lived (10 min), single-use, rate-limited, attempt-limited (max 5 wrong attempts), delivered by email and entered in the agent conversation.
    VerifyEmailCodeResponse:
      type: object
      required: [agent_state, status]
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4B)
      description: >-
        connection_id/connection_token/credential_expires_at are present only
        when status = EMAIL_VERIFIED. A wrong code returns CODE_INVALID; an
        expired code or one that has exhausted its five wrong attempts
        returns CODE_EXPIRED (a new BEGIN_EMAIL_VERIFICATION is required).
      properties:
        agent_state:
          type: string
          const: EMAIL_VERIFICATION
        status:
          $ref: '#/components/schemas/ContinuationStatus'
        connection_id:
          type: string
          description: Non-secret handle. Never sufficient alone to authorize a protected action.
        connection_token:
          type: string
          description: High-entropy secret credential, returned exactly once. The caller must retain it; Nobu stores only its hash.
        credential_expires_at:
          type: string
          format: date-time
    PreflightMonitoringRequest:
      type: object
      required: [action, connection_id, connection_token, discovery_session_id, monitoring_consent, email_alert_consent]
      additionalProperties: false
      x-nobu-implementation-status: PROPOSED / NOT IMPLEMENTED (Lane 7.4C)
      properties:
        action:
          type: string
          const: PREFLIGHT_MONITORING
        connection_id:
          type: string
        connection_token:
          type: string
          description: Required secret credential — connection_id alone is not authorization.
        discovery_session_id:
          type: string
          description: Must be in a confirmed state from a prior CONFIRM_PRODUCT call. Materialized into a durable, connection-owned purchase only by this call.
        monitoring_consent:
          type: boolean
          const: true
        email_alert_consent:
          type: boolean
          description: Captured alongside monitoring_consent; both must be true and durable before a payment quote is minted. Can be changed later via ENABLE_EMAIL_ALERTS/DISABLE_EMAIL_ALERTS without affecting monitoring_consent.
    PreflightMonitoringResponse:
      type: object
      required: [agent_state, status]
      properties:
        agent_state:
          type: string
          const: MONITORING_PREFLIGHT
        status:
          $ref: '#/components/schemas/ContinuationStatus'
        quote_id:
          type: string
          description: Present only when status = MONITORING_PAYMENT_READY.
        price_amount:
          type: number
          const: 0.99
        price_currency:
          type: string
          const: USD
        quote_expires_at:
          type: string
          format: date-time
        monitoring_deadline:
          type: string
          format: date-time
    ListActiveMonitorsRequest:
      type: object
      required: [action, connection_id, connection_token]
      additionalProperties: false
      x-nobu-implementation-status: PROPOSED / NOT IMPLEMENTED (Lane 7.4E)
      properties:
        action:
          type: string
          const: LIST_ACTIVE_MONITORS
        connection_id:
          type: string
        connection_token:
          type: string
    SetEmailAlertsRequest:
      type: object
      required: [action, connection_id, connection_token, purchase_id]
      additionalProperties: false
      x-nobu-implementation-status: PROPOSED / NOT IMPLEMENTED (Lane 7.4E)
      properties:
        action:
          type: string
          enum: [ENABLE_EMAIL_ALERTS, DISABLE_EMAIL_ALERTS]
        connection_id:
          type: string
        connection_token:
          type: string
        purchase_id:
          type: string
    StopMonitoringRequest:
      type: object
      required: [action, connection_id, connection_token, purchase_id]
      additionalProperties: false
      x-nobu-implementation-status: PROPOSED / NOT IMPLEMENTED (Lane 7.4E)
      properties:
        action:
          type: string
          const: STOP_MONITORING
        connection_id:
          type: string
        connection_token:
          type: string
        purchase_id:
          type: string
      description: >-
        Sets purchases.monitoring_stopped_at / monitoring_stop_reason =
        "user_requested". Distinct from archive (visibility-only, unchanged).
        Stopped purchases are excluded from scheduler selection. Never implies
        a refund.
    RevokeAgentConnectionRequest:
      type: object
      required: [action, connection_id, connection_token]
      additionalProperties: false
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4B)
      properties:
        action:
          type: string
          const: REVOKE_AGENT_CONNECTION
        connection_id:
          type: string
        connection_token:
          type: string
      description: >-
        Requires valid authorization (both connection_id and connection_token,
        matching the stored hash, unexpired, not already revoked). Revokes
        the connection and invalidates its token. Never deletes or stops
        monitors already started, and never implies a refund.
    RevokeAgentConnectionResponse:
      type: object
      required: [agent_state, status]
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4B)
      properties:
        agent_state:
          type: string
          const: AGENT_CONNECTION_REVOCATION
        status:
          $ref: '#/components/schemas/ContinuationStatus'
          description: >-
            CONNECTION_REVOKED on success (HTTP 200). ACTION_NOT_AUTHORIZED
            (HTTP 401) for any missing/wrong/expired/already-revoked
            credential — identical shape regardless of the underlying reason.
        connection_id:
          type: string
          description: Present only on success.
    StartMonitoringRequest:
      type: object
      required: [quote_id]
      additionalProperties: false
      x-nobu-implementation-status: PROPOSED / NOT IMPLEMENTED (Lane 7.4D, blocked on OKX topology re-check)
      properties:
        quote_id:
          type: string
          description: From a prior PREFLIGHT_MONITORING MONITORING_PAYMENT_READY response.
      description: >-
        No caller-supplied idempotency key of any kind. Activation identity
        is derived entirely server-side from quote_id, the OKX-verified
        settlement reference, the confirmed purchase, and the locked
        fingerprint (architecture document §7.3). Any extra field a caller
        sends here that resembles an idempotency key is ignored, not trusted.
    StartMonitoringResponse:
      type: object
      required: [agent_state, status, monitor_id]
      properties:
        agent_state:
          type: string
          const: MONITORING_ACTIVATION
        status:
          $ref: '#/components/schemas/ContinuationStatus'
        monitor_id:
          type: string
          description: Equals the underlying purchase_id — no parallel monitor id space is introduced.
        monitoring_deadline:
          type: string
          format: date-time

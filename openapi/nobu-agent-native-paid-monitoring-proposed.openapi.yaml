openapi: 3.1.0
info:
  title: Nobu Agent-Native Paid Monitoring API (IMPLEMENTED + DEPLOYED)
  version: 1.0.0
  description: >-
    Filename retained for reference stability (`nobu-agent-native-paid-monitoring-proposed.openapi.yaml`).
    Status as of Lane 8R: free agent actions and paid start-monitoring are
    IMPLEMENTED and DEPLOYED on UseNobu production. Official OKX seller verify/settle/status
    integration is live (fails closed without production credentials). The paid
    service is registered on ASP #5541 as a separate A2MCP service (fee 0.99) alongside
    the free service (fee 0); ASP #5541 is rejected / not listed and is not changed by this contract repair.
    Genuine payment marketplace proof is Lane 7.4G.

    Free actions on POST /v1/agent (also documented in openapi/nobu-a2mcp.openapi.yaml):
    UNDERSTAND_PURCHASE, CHECK_CONFIRMED_PURCHASE, CHECK_MONITORING_STATUS,
    DISCOVER_PRODUCT, CONFIRM_PRODUCT, BEGIN_EMAIL_VERIFICATION, VERIFY_EMAIL_CODE,
    PREFLIGHT_MONITORING, REVOKE_AGENT_CONNECTION, LIST_ACTIVE_MONITORS,
    ENABLE_EMAIL_ALERTS, DISABLE_EMAIL_ALERTS, STOP_MONITORING.

    Paid marketplace path: POST /v1/agent/monitoring-pass sells one $0.99
    Monitoring Pass. Payment issues the pass only and never starts monitoring.
    Free Purchase Setup and successful REDEEM_MONITORING_PASS are still required.

    Topology (resolved Lane 7.4D.0): separate free and paid A2MCP services under
    the existing Agent #5541 identity — not a second ASP.

    Source purity: OKX-specific facts from official OKX documentation / registry only.
  contact:
    name: Nobu internal architecture — not a public support channel
servers:
  - url: https://usenobu.vercel.app
    description: >-
      UseNobu production host for free /v1/agent and paid /v1/agent/monitoring-pass.
      Paid service is registered on ASP #5541; the agent remains rejected / not listed.
paths:
  /v1/agent:
    post:
      operationId: nobuAgentProposedFree
      summary: >-
        FREE-ONLY actions on /v1/agent (implemented and deployed). Never HTTP 402.
        Canonical free contract also lives in openapi/nobu-a2mcp.openapi.yaml.
      description: >-
        Extends the live AgentRequest oneOf (UNDERSTAND_PURCHASE,
        CHECK_CONFIRMED_PURCHASE, CHECK_MONITORING_STATUS — unchanged, see the
        live contract) with additive, backward-compatible free actions:
        DISCOVER_PRODUCT, CONFIRM_PRODUCT, BEGIN_EMAIL_VERIFICATION,
        VERIFY_EMAIL_CODE, PREFLIGHT_MONITORING, LIST_ACTIVE_MONITORS,
        ENABLE_EMAIL_ALERTS, DISABLE_EMAIL_ALERTS, STOP_MONITORING,
        REVOKE_AGENT_CONNECTION.

        Ordering: DISCOVER_PRODUCT and CONFIRM_PRODUCT operate on an
        unauthenticated, expiring discovery_session_id and require no
        connection — discovery never requires prior email verification, and
        no durable owned purchase or private monitoring state exists yet.
        BEGIN_EMAIL_VERIFICATION / VERIFY_EMAIL_CODE establish a verified
        connection_id + one-time connection_token. Every action after
        VERIFY_EMAIL_CODE requires both connection_id (a non-secret handle)
        and a valid connection_token (the secret credential) — the handle
        alone never authorizes anything. PREFLIGHT_MONITORING is the free/paid
        boundary: on full eligibility + consent pass it materializes the
        purchase, mints an enrollment quote, and returns
        MONITORING_PAYMENT_READY (a Nobu status in a 200 body, not an HTTP 402
        itself); it never takes payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposedFreeAgentRequest'
      responses:
        '200':
          description: Action result (status-bearing body; see ContinuationStatus)
        '400':
          description: Invalid input
        '401':
          description: Missing or invalid connection_token for a protected action (ACTION_NOT_AUTHORIZED)
        '404':
          description: Purchase, discovery session, connection, or quote not found
        '429':
          description: Rate limited
        '503':
          description: Provider unavailable
  /v1/agent/monitoring-pass:
    get:
      operationId: nobuMonitoringPassChallengeGet
      summary: >-
        Lane 8R.3B — registered paid A2MCP service 35958, "Nobu Monitoring Pass"
        ($0.99). Identical behaviour to POST.
      responses:
        '402':
          description: x402 v2 challenge (see POST).
        '200':
          description: Issued pass on a signed replay (see POST).
    post:
      operationId: nobuMonitoringPass
      summary: >-
        Lane 8R.3B — buys one Nobu Monitoring Pass. Replaces
        /v1/agent/start-monitoring as the registered paid service.
      description: >-
        Every initial call — GET or POST, body or no body — returns HTTP 402
        with the base64 x402 v2 challenge in the PAYMENT-REQUIRED header,
        before any business execution. Unlike /v1/agent/start-monitoring it
        requires no quote, connection, purchase or consent to issue that
        challenge: Lane 8R.3A proved that prerequisite-gated first contact is
        why OKX's validator reported `valid: false` and the review task timed
        out.


        The signed replay travels in the PAYMENT-SIGNATURE header (never the
        body) and returns the pass. Exactly-once issuance is anchored on the
        OKX-verified settlement reference (monitoring_passes.settlement_ref is
        UNIQUE), never on a caller-supplied identifier, so duplicate,
        concurrent and lost-response replays all resolve to the same pass. A
        pending settlement is recorded against the sha256 digest of the replay
        header — the raw header is never stored, logged, or returned.


        The pass is redeemed separately, by the free REDEEM_MONITORING_PASS
        action, which is where identity, confirmation, eligibility and consent
        gates apply.
      responses:
        '402':
          description: >-
            PAYMENT-REQUIRED header carries base64 of
            {x402Version: 2, resource: {url, description, mimeType}, accepts[]}.
            accepts[0]: scheme exact, network eip155:196, USD₮0 asset, amount
            990000 base units ($0.99), server-controlled payTo,
            maxTimeoutSeconds, and extra.name/extra.version EIP-712 token
            metadata. No quote binding.
            The body explains that payment issues a pass only and returns
            monitoring_active false and journey_complete false.
        '200':
          description: >-
            MONITORING_PASS_ISSUED with monitoring_active false,
            journey_complete false, next_action UNDERSTAND_PURCHASE,
            next_service_id 33561, required purchase input and clear
            continuation guidance. No pass token, payment signature,
            authorization header or wallet secret is returned. A pending
            settlement returns PAYMENT_SETTLEMENT_PENDING; no pass is issued
            until settlement confirms.
        '429':
          description: Rate limited (paid replay path only; an unpaid first contact is never rate limited).
  /v1/agent/start-monitoring:
    post:
      operationId: nobuAgentPaidActivation
      summary: >-
        IMPLEMENTED and DEPLOYED (Lanes 7.4D + 8R.0). Official OKX seller
        verify/settle/status. ASP paid-service registration still pending
        (Lane 8R). Not part of the free #5541 listing until registered.
      description: >-
        Consumes a settled OKX x402 payment against a previously issued,
        unexpired monitoring_enrollment_quotes row (minted by free
        PREFLIGHT_MONITORING) and performs exactly-once monitor activation.
        Challenge: x402 v2, scheme exact, network eip155:196 (X Layer),
        asset USD₮0, amount 990000 base units ($0.99), payTo server-owned only.
        Production uses official OKX seller HTTP APIs: verify, settle, and
        settle/status (HMAC credentials from env). Verify alone never activates.
        Pending settle may return PAYMENT_SETTLEMENT_PENDING and reconciles via
        status. Activation identity is derived server-side only — no caller
        idempotency key. Durable two-phase saga: AuthStore settlement/ledger
        then purchases projection; reconciliation never re-charges.
        Responses: MONITORING_STARTED, ALREADY_ACTIVE, ACTIVATION_PENDING.
        Payment does not guarantee a lower price, alert, refund, or adjustment.
      x-nobu-topology-status: >-
        RESOLVED (Lane 7.4D.0). Separate free and paid A2MCP services under
        existing Agent #5541 (not a second ASP). Free service untouched; paid
        service registered at Lane 8R via agent update --service create.
      x-nobu-deployment-status: >-
        Route deployed on UseNobu production. Fail closed without OKX seller
        credentials. Marketplace registration of the paid service is Lane 8R.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartMonitoringRequest'
      responses:
        '200':
          description: >-
            MONITORING_STARTED (first successful activation), ALREADY_ACTIVE
            (valid replay of an already-active quote — never a 409), or
            ACTIVATION_PENDING (settlement durably recorded, projection to
            the purchases database not yet complete; never re-requests
            payment — see description above and architecture §7.4/§7.6).
        '400':
          description: >-
            Invalid input (schema violation — only quote_id/connection_id/connection_token
            are ever accepted). Body additionally carries `required_fields`,
            `next_action`, and `documentation` (Lane 8R.3) so a caller who has
            not yet run the free flow can self-correct without external docs.
        '401':
          description: >-
            ACTION_NOT_AUTHORIZED — missing/invalid/expired connection_token,
            or a quote this connection did not create. Identical shape
            regardless of the underlying reason. Body additionally carries a
            reason-agnostic `message`, `next_action`, and `documentation`
            (Lane 8R.3) pointing back to the free-flow PREFLIGHT_MONITORING
            step — never which specific check failed.
        '402':
          description: >-
            OKX x402 Payment Required challenge (PAYMENT-REQUIRED header,
            base64 {x402Version, resource, accepts}) bound to this exact
            quote_id and resource — never reusable across quotes. Also
            returned (re-challenging) when a submitted PAYMENT-SIGNATURE
            header fails verification; an invalid/altered payment never
            activates. Accepts: x402 v2 exact, network eip155:196, USD₮0,
            amount 990000 base units ($0.99), payTo from server env only.
            Official OKX seller verify/settle/status is used in production;
            the integration fails closed when seller credentials are absent
            (never invents settlement). Do not put credentials or real
            settlement references in examples.
        '404':
          description: >-
            CONNECTION_EXPIRED — as implemented, this single status covers
            every case where the quote is not genuinely payable right now:
            not found, not owned by this connection's prior quote issuance,
            not status=issued, expired, price/fingerprint altered from what
            was issued, or the underlying purchase is missing or no longer
            MONITORING_PAYMENT_READY. Fails closed uniformly rather than
            distinguishing 404/409/422/423 — the caller must re-run
            PREFLIGHT_MONITORING for a fresh quote in every case. Body
            additionally carries the same reason-agnostic `message`,
            `next_action`, and `documentation` as 401 (Lane 8R.3).
components:
  schemas:
    ContinuationStatus:
      type: string
      description: >-
        Additive to the live A2mcpStatus/agent-response vocabulary.
        EMAIL_CODE_SENT, EMAIL_VERIFIED, CODE_INVALID, CODE_EXPIRED,
        ACTION_NOT_AUTHORIZED, and CONNECTION_REVOKED are IMPLEMENTED
        (Lane 7.4B). MORE_INFORMATION_REQUIRED, PRODUCT_CONFIRMATION_REQUIRED,
        PRODUCT_CONFIRMED, CANDIDATE_NOT_CONFIRMABLE, CONNECTION_EXPIRED,
        CONSENT_REQUIRED, MONITORING_PAYMENT_READY, UNSUPPORTED_PURCHASE,
        POLICY_EXCLUSION, WINDOW_EXPIRED, and POLICY_STALE are IMPLEMENTED
        for DISCOVER_PRODUCT / CONFIRM_PRODUCT / PREFLIGHT_MONITORING (Lane
        7.4C) — the last four are the existing locked policy statuses
        (`docs/nobu-clean-master-spec.md` §8), returned as-is rather than
        wrapped. PAYMENT_PENDING, PAYMENT_SETTLEMENT_PENDING, MONITORING_STARTED,
        ACTIVATION_PENDING, and ALREADY_ACTIVE are IMPLEMENTED for
        `POST /v1/agent/start-monitoring` (deployed; ASP paid service registered, under review
        Lane 8R).
      enum:
        - MORE_INFORMATION_REQUIRED
        - PRODUCT_CONFIRMATION_REQUIRED
        - PRODUCT_CONFIRMED
        - CANDIDATE_NOT_CONFIRMABLE
        - EMAIL_VERIFICATION_REQUIRED
        - EMAIL_CODE_SENT
        - EMAIL_VERIFIED
        - CODE_INVALID
        - CODE_EXPIRED
        - CONNECTION_REVOKED
        - CONSENT_REQUIRED
        - MONITORING_PAYMENT_READY
        - PAYMENT_PENDING
        - PAYMENT_SETTLEMENT_PENDING
        - MONITORING_STARTED
        - ACTIVATION_PENDING
        - MONITORING_ACTIVE
        - PRICE_DROP_DETECTED
        - ALREADY_ACTIVE
        - ACTION_NOT_AUTHORIZED
        - CONNECTION_EXPIRED
        - UNSUPPORTED_PURCHASE
        - POLICY_EXCLUSION
        - WINDOW_EXPIRED
        - POLICY_STALE
    ProposedFreeAgentRequest:
      oneOf:
        - $ref: '#/components/schemas/DiscoverProductRequest'
        - $ref: '#/components/schemas/ConfirmProductRequest'
        - $ref: '#/components/schemas/BeginEmailVerificationRequest'
        - $ref: '#/components/schemas/VerifyEmailCodeRequest'
        - $ref: '#/components/schemas/PreflightMonitoringRequest'
        - $ref: '#/components/schemas/ListActiveMonitorsRequest'
        - $ref: '#/components/schemas/SetEmailAlertsRequest'
        - $ref: '#/components/schemas/StopMonitoringRequest'
        - $ref: '#/components/schemas/RevokeAgentConnectionRequest'
    DiscoveryPurchaseFields:
      type: object
      required: [purchase_price, purchase_date]
      additionalProperties: false
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4C)
      description: >-
        Validated structured purchase fields — mirrors the existing
        UNDERSTAND_PURCHASE extracted_purchase intake contract, never raw
        free text. Discovery never accepts or stores raw purchase_text; only
        already-confirmed structured fields. At least one product clue
        (product_title, product_description, target_product_url,
        target_item_id, model_number, or upc_or_gtin) is required alongside
        purchase_price and purchase_date — enforced server-side by the same
        canSubmitFindProduct / assessProductClues gate the consumer web flow
        uses (src/web/product-clue.ts).
      properties:
        purchase_price:
          type: number
          exclusiveMinimum: 0
        purchase_date:
          type: string
          format: date
        purchase_channel:
          type: string
          const: target_online
          default: target_online
        country:
          type: string
          const: US
          default: US
        region:
          type: string
        product_title:
          type: string
          maxLength: 200
        product_description:
          type: string
          maxLength: 2000
        target_product_url:
          type: string
        target_item_id:
          type: string
        model_number:
          type: string
        upc_or_gtin:
          type: string
        brand:
          type: string
        size:
          type: string
        color:
          type: string
        quantity:
          type: string
    DiscoverProductRequest:
      type: object
      required: [action, purchase]
      additionalProperties: false
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4C)
      properties:
        action:
          type: string
          const: DISCOVER_PRODUCT
        purchase:
          $ref: '#/components/schemas/DiscoveryPurchaseFields'
      description: >-
        No connection_id/connection_token required — discovery never requires
        prior email verification and creates no durable owned purchase.
        Reuses the existing Target discovery client
        (src/web/live-discovery.ts) and the bounded, Target-Plus-excluding
        multi-candidate evaluator (src/matching/discovery-candidates.ts).
        The validated structured snapshot (never raw purchase text) is
        stored durably on the discovery_sessions row for later
        materialization by PREFLIGHT_MONITORING.
    DiscoverProductResponse:
      type: object
      required: [agent_state, status, discovery_session_id, discovery_session_expires_at, candidates]
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4C)
      properties:
        agent_state:
          type: string
          const: PRODUCT_DISCOVERY
        status:
          $ref: '#/components/schemas/ContinuationStatus'
          description: PRODUCT_CONFIRMATION_REQUIRED when at least one candidate was found, else MORE_INFORMATION_REQUIRED.
        discovery_session_id:
          type: string
          description: Expiring, server-issued handle for the candidate snapshot. Not a credential; not owned by any account.
        discovery_session_expires_at:
          type: string
          format: date-time
          description: 30 minutes from issuance.
        candidates:
          type: array
          description: Bounded (max 5) Target-seller-only candidates; Target Plus and non-Target sellers are excluded, never returned.
          items:
            type: object
            required: [candidate_id, title, confirmable]
            additionalProperties: false
            properties:
              candidate_id:
                type: string
              title:
                type: string
              target_item_id:
                type: string
                nullable: true
              model_number:
                type: string
                nullable: true
              upc_or_gtin:
                type: string
                nullable: true
              target_product_url:
                type: string
                nullable: true
              observed_price:
                type: number
                nullable: true
              currency:
                type: string
                nullable: true
              confirmable:
                type: boolean
                description: True only when CONFIRM_PRODUCT would accept this candidate_id (strong tier, not title-only, Target seller, not Target Plus).
    ConfirmProductRequest:
      type: object
      required: [action, discovery_session_id, candidate_id]
      additionalProperties: false
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4C)
      properties:
        action:
          type: string
          const: CONFIRM_PRODUCT
        discovery_session_id:
          type: string
          description: From a prior DISCOVER_PRODUCT response.
        candidate_id:
          type: string
          description: >-
            Server-issued candidate id from that same discovery session.
            Never a client-asserted product payload — reuses the existing
            reload-and-revalidate confirmation pattern from
            src/matching/confirm.ts, scoped to the discovery session rather
            than an account.
      description: >-
        No connection_id/connection_token required. Locks a fingerprint
        against the discovery session only; still no durable owned purchase.
        Rejects stale/expired sessions, tampered/unknown candidate ids, and
        non-Target/Target-Plus/weak/title-only candidates — identical
        revalidation rules to the consumer web confirmation flow.
    ConfirmProductResponse:
      type: object
      required: [agent_state, status]
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4C)
      description: >-
        target_product_url/target_item_id/model_number/upc_or_gtin are
        present only when status = PRODUCT_CONFIRMED.
      properties:
        agent_state:
          type: string
          const: PRODUCT_CONFIRMATION
        status:
          $ref: '#/components/schemas/ContinuationStatus'
          description: >-
            PRODUCT_CONFIRMED on success. CANDIDATE_NOT_CONFIRMABLE (HTTP 400)
            for tampered/unknown/weak/title-only/non-Target/Target-Plus
            candidates. CONNECTION_EXPIRED (HTTP 404) for a missing, stale,
            or already-materialized discovery session.
        discovery_session_id:
          type: string
        target_product_url:
          type: string
          nullable: true
        target_item_id:
          type: string
          nullable: true
        model_number:
          type: string
          nullable: true
        upc_or_gtin:
          type: string
          nullable: true
    BeginEmailVerificationRequest:
      type: object
      required: [action, email]
      additionalProperties: false
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4B)
      properties:
        action:
          type: string
          const: BEGIN_EMAIL_VERIFICATION
        email:
          type: string
          format: email
      description: >-
        No connection_id/connection_token required. Creates a pending
        connection scoped to this email and sends a six-digit code through
        the existing Resend-backed email provider. Never reveals whether the
        email already has an account — no account row is touched until
        VERIFY_EMAIL_CODE succeeds. Rate-limited per-email and per-request-source.
    BeginEmailVerificationResponse:
      type: object
      required: [agent_state, status, connection_id, expires_at, resend_after_seconds]
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4B)
      properties:
        agent_state:
          type: string
          const: EMAIL_VERIFICATION
        status:
          $ref: '#/components/schemas/ContinuationStatus'
        connection_id:
          type: string
          description: >-
            Non-secret handle for the pending connection. Never sufficient
            alone to authorize a protected action.
        expires_at:
          type: string
          format: date-time
          description: Code expiry — 10 minutes from issuance.
        resend_after_seconds:
          type: integer
    VerifyEmailCodeRequest:
      type: object
      required: [action, connection_id, code]
      additionalProperties: false
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4B)
      properties:
        action:
          type: string
          const: VERIFY_EMAIL_CODE
        connection_id:
          type: string
          description: From a prior BEGIN_EMAIL_VERIFICATION response.
        code:
          type: string
          minLength: 6
          description: Exactly six numeric digits. Short-lived (10 min), single-use, rate-limited, attempt-limited (max 5 wrong attempts), delivered by email and entered in the agent conversation.
    VerifyEmailCodeResponse:
      type: object
      required: [agent_state, status]
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4B)
      description: >-
        connection_id/connection_token/credential_expires_at are present only
        when status = EMAIL_VERIFIED. A wrong code returns CODE_INVALID; an
        expired code or one that has exhausted its five wrong attempts
        returns CODE_EXPIRED (a new BEGIN_EMAIL_VERIFICATION is required).
      properties:
        agent_state:
          type: string
          const: EMAIL_VERIFICATION
        status:
          $ref: '#/components/schemas/ContinuationStatus'
        connection_id:
          type: string
          description: Non-secret handle. Never sufficient alone to authorize a protected action.
        connection_token:
          type: string
          description: High-entropy secret credential, returned exactly once. The caller must retain it; Nobu stores only its hash.
        credential_expires_at:
          type: string
          format: date-time
    PreflightMonitoringRequest:
      type: object
      required: [action, connection_id, connection_token, discovery_session_id, monitoring_consent, email_alert_consent]
      additionalProperties: false
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4C)
      properties:
        action:
          type: string
          const: PREFLIGHT_MONITORING
        connection_id:
          type: string
        connection_token:
          type: string
          description: Required secret credential — connection_id alone is not authorization.
        discovery_session_id:
          type: string
          description: Must be in a confirmed state from a prior CONFIRM_PRODUCT call. Materialized into a durable, connection-owned purchase only by this call.
        monitoring_consent:
          type: boolean
          description: >-
            Not schema-const-true: a caller sending false receives
            CONSENT_REQUIRED (HTTP 400) rather than a schema-validation
            error, so the agent gets a truthful continuation status instead
            of a generic 400. Both this and email_alert_consent must be true
            and are recorded as durable timestamps before a quote is minted.
        email_alert_consent:
          type: boolean
          description: Captured alongside monitoring_consent; both must be true and durable before a payment quote is minted. Can be changed later via ENABLE_EMAIL_ALERTS/DISABLE_EMAIL_ALERTS without affecting monitoring_consent.
      description: >-
        Materializes exactly one account-owned purchase from the confirmed
        discovery session's validated structured snapshot, attaches the
        locked fingerprint, records both consents, and runs the existing
        deterministic Target eligibility/window check
        (src/policy/evaluate-target-policy.ts) before minting a quote.
        Idempotent: retries or concurrent calls for the same
        connection/session never create a second purchase or a second
        active quote (server-derived reservation + a partial-unique DB
        index on one active quote per purchase).
    PreflightMonitoringResponse:
      type: object
      required: [agent_state, status]
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4C)
      description: >-
        quote_id/price_amount/price_currency/quote_expires_at are present
        only when status = MONITORING_PAYMENT_READY. Ineligible purchases
        return the existing locked policy status directly (UNSUPPORTED_PURCHASE
        / POLICY_EXCLUSION / WINDOW_EXPIRED / POLICY_STALE, HTTP 200, no
        quote) rather than a wrapped/invented status.
      properties:
        agent_state:
          type: string
          const: MONITORING_PREFLIGHT
        status:
          $ref: '#/components/schemas/ContinuationStatus'
        quote_id:
          type: string
          description: Present only when status = MONITORING_PAYMENT_READY.
        price_amount:
          type: number
          const: 0.99
        price_currency:
          type: string
          const: USD
        quote_expires_at:
          type: string
          format: date-time
          description: 15 minutes from issuance.
        monitoring_deadline:
          type: string
          format: date-time
          nullable: true
    ListActiveMonitorsRequest:
      type: object
      required: [action, connection_id, connection_token]
      additionalProperties: false
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4E)
      properties:
        action:
          type: string
          const: LIST_ACTIVE_MONITORS
        connection_id:
          type: string
        connection_token:
          type: string
    SetEmailAlertsRequest:
      type: object
      required: [action, connection_id, connection_token, purchase_id]
      additionalProperties: false
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4E)
      properties:
        action:
          type: string
          enum: [ENABLE_EMAIL_ALERTS, DISABLE_EMAIL_ALERTS]
        connection_id:
          type: string
        connection_token:
          type: string
        purchase_id:
          type: string
    StopMonitoringRequest:
      type: object
      required: [action, connection_id, connection_token, purchase_id]
      additionalProperties: false
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4E)
      properties:
        action:
          type: string
          const: STOP_MONITORING
        connection_id:
          type: string
        connection_token:
          type: string
        purchase_id:
          type: string
      description: >-
        Sets purchases.monitoring_stopped_at / monitoring_stop_reason =
        "user_requested". Distinct from archive (visibility-only, unchanged).
        Stopped purchases are excluded from scheduler selection. Never implies
        a refund.
    RevokeAgentConnectionRequest:
      type: object
      required: [action, connection_id, connection_token]
      additionalProperties: false
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4B)
      properties:
        action:
          type: string
          const: REVOKE_AGENT_CONNECTION
        connection_id:
          type: string
        connection_token:
          type: string
      description: >-
        Requires valid authorization (both connection_id and connection_token,
        matching the stored hash, unexpired, not already revoked). Revokes
        the connection and invalidates its token. Never deletes or stops
        monitors already started, and never implies a refund.
    RevokeAgentConnectionResponse:
      type: object
      required: [agent_state, status]
      x-nobu-implementation-status: IMPLEMENTED (Lane 7.4B)
      properties:
        agent_state:
          type: string
          const: AGENT_CONNECTION_REVOCATION
        status:
          $ref: '#/components/schemas/ContinuationStatus'
          description: >-
            CONNECTION_REVOKED on success (HTTP 200). ACTION_NOT_AUTHORIZED
            (HTTP 401) for any missing/wrong/expired/already-revoked
            credential — identical shape regardless of the underlying reason.
        connection_id:
          type: string
          description: Present only on success.
    StartMonitoringRequest:
      type: object
      required: [quote_id, connection_id, connection_token]
      additionalProperties: false
      x-nobu-implementation-status: IMPLEMENTED + DEPLOYED (Lanes 7.4D + 8R.0); ASP paid service registered Lane 8R (under review)
      properties:
        quote_id:
          type: string
          description: From a prior PREFLIGHT_MONITORING MONITORING_PAYMENT_READY response.
        connection_id:
          type: string
          description: Non-secret handle. Never sufficient alone to authorize activation.
        connection_token:
          type: string
          description: Required secret credential from VERIFY_EMAIL_CODE — connection_id alone is not authorization.
      description: >-
        The request body carries only these three fields — no
        amount/purchase-id/fingerprint-id/settlement-reference/transaction-hash/
        idempotency-key of any kind. The signed payment replay travels
        separately, in the PAYMENT-SIGNATURE header (never the body). Every
        other authoritative value (purchase, fingerprint, price, quote
        validity) is reloaded server-side. Activation identity is derived
        entirely server-side from quote_id, the OKX-verified settlement
        reference, the confirmed purchase, and the locked fingerprint
        (architecture document §7.3). Any extra field a caller sends here
        that resembles an idempotency key is rejected by the strict schema,
        not silently ignored.
    StartMonitoringResponse:
      type: object
      required: [agent_state, status]
      x-nobu-implementation-status: IMPLEMENTED + DEPLOYED (Lanes 7.4D + 8R.0); ASP paid service registered Lane 8R (under review)
      description: >-
        monitor_id is present whenever status is MONITORING_STARTED,
        ALREADY_ACTIVE, or ACTIVATION_PENDING; absent for
        PAYMENT_PENDING/ACTION_NOT_AUTHORIZED/CONNECTION_EXPIRED, none of
        which have a monitor yet. monitoring_deadline is present only
        alongside MONITORING_STARTED/ALREADY_ACTIVE (projection has visibly
        completed), never alongside ACTIVATION_PENDING.
      properties:
        agent_state:
          type: string
          const: MONITORING_ACTIVATION
        status:
          $ref: '#/components/schemas/ContinuationStatus'
        monitor_id:
          type: string
          description: Equals the underlying purchase_id — no parallel monitor id space is introduced.
        monitoring_deadline:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
          description: >-
            Lane 8R.3 — present on 400/401/404 only. Reason-agnostic; never
            distinguishes which specific check failed.
        required_fields:
          type: array
          items:
            type: string
          description: Lane 8R.3 — present on 400 (schema violation) only.
        next_action:
          type: string
          description: >-
            Lane 8R.3 — present on 400/401/404 only. Always points back to
            completing the free /v1/agent setup flow (PREFLIGHT_MONITORING)
            for a fresh quote_id/connection_id/connection_token.
        documentation:
          type: string
          format: uri
          description: Lane 8R.3 — present on 400/401/404 only. The public Nobu-on-OKX.AI customer guide.
